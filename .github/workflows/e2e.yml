name: E2E Test

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

# The TUI (tuistory) and web review (HTTP + Playwright) suites run as
# parallel jobs.
jobs:

  e2e-tui:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Build
      run: go build -o commd .

    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.4.2"

    - name: Install dependencies
      run: cd e2e && bun install --frozen-lockfile

    - name: Run TUI E2E tests
      run: cd e2e && bun test $(ls tests/*.test.ts | grep -v '^tests/web')

  e2e-web:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Build
      run: go build -o commd .

    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.4.2"

    - name: Install dependencies
      run: cd e2e && bun install --frozen-lockfile

    # web-ui*.test.ts drive the `review --web` page in headless Chromium.
    - name: Install Playwright Chromium
      run: cd e2e && bunx playwright install --with-deps chromium

    - name: Run web review E2E tests
      run: cd e2e && bun test tests/web
